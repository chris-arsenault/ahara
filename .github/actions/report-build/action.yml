name: Report Engineering Data
description: Normalize build, test, coverage, and Qlty artifacts into the engineering datastore.

runs:
  using: composite
  steps:
    - name: Ingest engineering report
      run: |
        set -euo pipefail
        webhook_url=$(aws ssm get-parameter --name /ahara/ci/url --query Parameter.Value --output text --region us-east-1)
        ingest_token=$(aws ssm get-parameter --name /ahara/ci/ingest-token --with-decryption --query Parameter.Value --output text --region us-east-1)
        WEBHOOK_URL="${webhook_url}" INGEST_TOKEN="${ingest_token}" python3 "${GITHUB_ACTION_PATH}/report.py"
      env:
        GITHUB_TOKEN: ${{ github.token }}
      shell: bash
