config_version = "0"

exclude_patterns = [
  "**/.terraform/**",
  "**/build/**",
  "**/coverage/**",
  "**/dist/**",
  "**/generated/**",
  "**/node_modules/**",
  "**/target/**",
  "**/target-clippy/**",
  "**/target-cov/**",
  "**/target-lambda/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/tests/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true
