name: Browser workflow contracts
on:
  push:
    branches: [main]
    paths:
      - .github/actions/browser-config/**
      - .github/actions/browser-tests/**
      - .github/actions/browser-runtime/**
      - .github/workflows/ci.yml
      - .github/workflows/test-browser-workflow.yml
  pull_request:
    paths:
      - .github/actions/browser-config/**
      - .github/actions/browser-tests/**
      - .github/actions/browser-runtime/**
      - .github/workflows/ci.yml
      - .github/workflows/test-browser-workflow.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install configuration test dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Test detection and deployment gates
        run: python3 .github/actions/browser-config/test_config.py
      - name: Test browser runtime and failure propagation
        run: node --test .github/actions/browser-runtime/run.test.mjs
