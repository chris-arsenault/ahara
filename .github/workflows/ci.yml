name: CI/CD

on:
  workflow_call:
    inputs:
      deploy:
        description: Run standard deploy (build + migrate + terraform apply) on main
        type: boolean
        default: true
      rust_extra_ci_commands:
        description: Optional repo-root shell commands for additional Rust CI checks inside the shared job
        type: string
        default: ""
    secrets:
      OIDC_ROLE:
        required: true
      STATE_BUCKET:
        required: true

jobs:
  ci:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && format('{0}-deploy', github.event.repository.name) || format('{0}-{1}', github.event.repository.name, github.ref) }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: chris-arsenault/ahara/.github/actions/governance-check@main

      - name: Read platform.yml
        id: config
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import yaml, os, json
          with open("platform.yml") as f:
              cfg = yaml.safe_load(f)
          stack = cfg.get("stack", [])
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              f.write(f"project={cfg['project']}\n")
              f.write(f"has_rust={'true' if 'rust' in stack else 'false'}\n")
              f.write(f"has_typescript={'true' if 'typescript' in stack else 'false'}\n")
              f.write(f"has_python={'true' if 'python' in stack else 'false'}\n")
              f.write(f"has_terraform={'true' if 'terraform' in stack else 'false'}\n")
              f.write(f"has_vendor={'true' if 'vendor' in stack else 'false'}\n")
              f.write(f"has_android={'true' if 'android' in stack else 'false'}\n")
              f.write(f"has_migrations={'true' if cfg.get('migrations') else 'false'}\n")
              f.write(f"migrations_dir={cfg.get('migrations', '')}\n")
              f.write(f"has_truenas={'true' if cfg.get('truenas') else 'false'}\n")
              f.write(f"truenas_images={'true' if cfg.get('truenas_images', True) else 'false'}\n")
              truenas_compose_path = cfg.get('truenas_compose_path', 'compose.yaml')
              f.write(f"truenas_compose_path={truenas_compose_path}\n")
              f.write(f"truenas_compose_check_paths={json.dumps(cfg.get('truenas_compose_check_paths') or [truenas_compose_path])}\n")
              truenas_roles_anywhere = cfg.get('truenas_roles_anywhere') or {}
              if truenas_roles_anywhere and not isinstance(truenas_roles_anywhere, dict):
                  raise SystemExit("platform.yml: truenas_roles_anywhere must be a mapping")
              normalized_ra = []
              for name, workload in truenas_roles_anywhere.items():
                  if not isinstance(name, str) or not name.strip():
                      raise SystemExit("platform.yml: truenas_roles_anywhere workload names must be non-empty strings")
                  if not isinstance(workload, dict):
                      workload = {}
                  env_prefix = workload.get("env_prefix") or f"AWS_RA_{name.upper().replace('-', '_')}"
                  if not isinstance(env_prefix, str) or not env_prefix.strip():
                      raise SystemExit(f"platform.yml: truenas_roles_anywhere.{name}.env_prefix must be a string")
                  normalized_ra.append({"name": name, "env_prefix": env_prefix})
              f.write(f"truenas_roles_anywhere={json.dumps(normalized_ra)}\n")
              dashboards_cfg = (cfg.get("observability") or {}).get("dashboards") or {}
              has_grafana_dashboards = bool(dashboards_cfg)
              if dashboards_cfg and not isinstance(dashboards_cfg, dict):
                  raise SystemExit("platform.yml: observability.dashboards must be a mapping")
              dashboard_path = dashboards_cfg.get("path", "")
              dashboard_folder_uid = dashboards_cfg.get("folder_uid", "")
              dashboard_folder_title = dashboards_cfg.get("folder_title", "")
              dashboard_prune = dashboards_cfg.get("prune", True)
              if has_grafana_dashboards:
                  missing = [
                      key for key, value in {
                          "path": dashboard_path,
                          "folder_uid": dashboard_folder_uid,
                          "folder_title": dashboard_folder_title,
                      }.items()
                      if not isinstance(value, str) or not value.strip()
                  ]
                  if missing:
                      raise SystemExit(
                          "platform.yml: observability.dashboards missing required key(s): "
                          + ", ".join(missing)
                      )
                  if not isinstance(dashboard_prune, bool):
                      raise SystemExit("platform.yml: observability.dashboards.prune must be a boolean")
              f.write(f"has_grafana_dashboards={'true' if has_grafana_dashboards else 'false'}\n")
              f.write(f"dashboard_path={dashboard_path}\n")
              f.write(f"dashboard_folder_uid={dashboard_folder_uid}\n")
              f.write(f"dashboard_folder_title={dashboard_folder_title}\n")
              f.write(f"dashboard_prune={'true' if dashboard_prune else 'false'}\n")
              # Rust artifacts — explicit declaration of what gets built where
              rust_artifacts = cfg.get("rust_artifacts") or {}
              rust_lambdas = rust_artifacts.get("lambdas") or []
              rust_binaries = rust_artifacts.get("binaries") or []
              f.write(f"has_rust_lambdas={'true' if rust_lambdas else 'false'}\n")
              f.write(f"has_rust_binaries={'true' if rust_binaries else 'false'}\n")
              f.write(f"rust_lambdas={json.dumps(rust_lambdas)}\n")
              f.write(f"rust_binaries={json.dumps(rust_binaries)}\n")
              f.write(f"rust_telemetry_adoption={'true' if cfg.get('rust_telemetry_adoption') else 'false'}\n")
              android_cfg = cfg.get("android") or {}
              if "android" in stack:
                  if not isinstance(android_cfg, dict):
                      raise SystemExit("platform.yml: android must be a mapping when present")
                  missing = [
                      key for key, value in {
                          "android.dir": android_cfg.get("dir"),
                          "android.ci_task": android_cfg.get("ci_task"),
                      }.items()
                      if not isinstance(value, str) or not value.strip()
                  ]
                  if missing:
                      raise SystemExit("platform.yml: android missing required key(s): " + ", ".join(missing))
                  android_dir = android_cfg["dir"]
                  android_gradle_task = android_cfg["ci_task"]
              else:
                  android_dir = ""
                  android_gradle_task = ""
              f.write(f"android_dir={android_dir}\n")
              f.write(f"android_gradle_task={android_gradle_task}\n")
              fdroid_cfg = cfg.get("fdroid") or {}
              has_fdroid = bool(fdroid_cfg)
              if fdroid_cfg and not isinstance(fdroid_cfg, dict):
                  raise SystemExit("platform.yml: fdroid must be a mapping when present")
              if has_fdroid:
                  missing = [
                      key for key, value in {
                          "app_id": fdroid_cfg.get("app_id"),
                          "repo_name": fdroid_cfg.get("repo_name"),
                          "repo_description": fdroid_cfg.get("repo_description"),
                          "hostname": fdroid_cfg.get("hostname"),
                          "apk_glob": fdroid_cfg.get("apk_glob"),
                          "metadata_path": fdroid_cfg.get("metadata_path"),
                      }.items()
                      if not isinstance(value, str) or not value.strip()
                  ]
                  if missing:
                      raise SystemExit("platform.yml: fdroid missing required key(s): " + ", ".join(missing))
                  fdroid_repo_name = fdroid_cfg["repo_name"]
                  fdroid_repo_description = fdroid_cfg["repo_description"]
                  fdroid_hostname = fdroid_cfg["hostname"]
                  fdroid_app_id = fdroid_cfg["app_id"]
                  fdroid_apk_glob = fdroid_cfg["apk_glob"]
                  fdroid_metadata_path = fdroid_cfg["metadata_path"]
              else:
                  fdroid_repo_name = ""
                  fdroid_repo_description = ""
                  fdroid_hostname = ""
                  fdroid_app_id = ""
                  fdroid_apk_glob = ""
                  fdroid_metadata_path = ""
              f.write(f"has_fdroid={'true' if has_fdroid else 'false'}\n")
              f.write(f"fdroid_repo_name={fdroid_repo_name}\n")
              f.write(f"fdroid_repo_description={fdroid_repo_description}\n")
              f.write(f"fdroid_hostname={fdroid_hostname}\n")
              f.write(f"fdroid_app_id={fdroid_app_id}\n")
              f.write(f"fdroid_apk_glob={fdroid_apk_glob}\n")
              f.write(f"fdroid_metadata_path={fdroid_metadata_path}\n")
              rust_shared_crates_dir = cfg.get("rust_shared_crates_dir", "")
              f.write(f"has_rust_shared_crates={'true' if rust_shared_crates_dir else 'false'}\n")
              f.write(f"rust_shared_crates_dir={rust_shared_crates_dir}\n")
              # Detect directories from filesystem unless the manifest pins them
              import glob
              cargo_files = glob.glob('**/Cargo.toml', recursive=True)
              rust_dir_override = cfg.get('rust_dir')
              if rust_dir_override:
                  rust_dir = rust_dir_override
              elif cargo_files:
                  # Find the workspace root (shallowest Cargo.toml)
                  rust_dir = os.path.dirname(sorted(cargo_files, key=lambda p: p.count('/'))[0]) or '.'
              else:
                  rust_dir = 'backend'
              pkg_jsons = [p for p in glob.glob('**/package.json', recursive=True)
                           if 'node_modules' not in p and 'backend' not in p]
              if pkg_jsons:
                  ts_dir = os.path.dirname(sorted(pkg_jsons, key=lambda p: p.count('/'))[0]) or '.'
              else:
                  ts_dir = 'frontend'
              # Python uses same dir as Rust (both live in backend/)
              python_dir = rust_dir
              f.write(f"rust_dir={rust_dir}\n")
              f.write(f"typescript_dir={ts_dir}\n")
              f.write(f"python_dir={python_dir}\n")
              images = cfg.get('images', [])
              if images:
                  f.write(f"images={json.dumps(images)}\n")
              else:
                  f.write(f"images=\n")
          PYEOF
        shell: bash

      # ── Rust ────────────────────────────────────────────────

      - name: Restore Rust caches
        if: steps.config.outputs.has_rust == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            **/target
            **/target-clippy
            **/target-cov
            **/target-lambda
          key: rust-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ hashFiles('**/Cargo.lock') }}-
            rust-

      - name: Lint rustfmt
        if: steps.config.outputs.has_rust == 'true'
        working-directory: ${{ steps.config.outputs.rust_dir }}
        run: cargo fmt -- --check

      - name: Install cargo-lambda
        if: steps.config.outputs.has_rust_lambdas == 'true'
        run: pip3 install cargo-lambda ziglang

      - name: Install cargo-llvm-cov
        if: steps.config.outputs.has_rust == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Lint clippy
        if: steps.config.outputs.has_rust == 'true'
        working-directory: ${{ steps.config.outputs.rust_dir }}
        run: CARGO_TARGET_DIR=target-clippy cargo clippy --release -- -D warnings -W clippy::cognitive_complexity

      - name: Check Rust Lambda telemetry adoption
        if: steps.config.outputs.has_rust == 'true' && steps.config.outputs.rust_telemetry_adoption == 'true'
        run: |
          set -euo pipefail
          cargo install --git https://github.com/chris-arsenault/ahara-infra.git ahara-lambda-telemetry --bin ahara-telemetry-adoption-check --locked --force
          ahara-telemetry-adoption-check "${{ steps.config.outputs.rust_dir }}"

      - name: Lint shared Rust crates
        if: steps.config.outputs.has_rust == 'true' && steps.config.outputs.has_rust_shared_crates == 'true'
        working-directory: ${{ steps.config.outputs.rust_shared_crates_dir }}
        run: cargo clippy --workspace -- -D warnings

      - name: Format shared Rust crates
        if: steps.config.outputs.has_rust == 'true' && steps.config.outputs.has_rust_shared_crates == 'true'
        working-directory: ${{ steps.config.outputs.rust_shared_crates_dir }}
        run: cargo fmt --check

      - name: Test shared Rust crates
        if: steps.config.outputs.has_rust == 'true' && steps.config.outputs.has_rust_shared_crates == 'true'
        working-directory: ${{ steps.config.outputs.rust_shared_crates_dir }}
        run: cargo test --workspace

      - name: Run extra Rust CI commands
        if: steps.config.outputs.has_rust == 'true' && inputs.rust_extra_ci_commands != ''
        env:
          RUST_EXTRA_CI_COMMANDS: ${{ inputs.rust_extra_ci_commands }}
        run: |
          set -euo pipefail
          tmp_script="$(mktemp)"
          trap 'rm -f "$tmp_script"' EXIT
          printf '%s\n' "$RUST_EXTRA_CI_COMMANDS" > "$tmp_script"
          bash -euo pipefail "$tmp_script"

      - name: Test rust
        if: steps.config.outputs.has_rust == 'true'
        working-directory: ${{ steps.config.outputs.rust_dir }}
        run: |
          mkdir -p coverage
          CARGO_TARGET_DIR=target-cov cargo llvm-cov --release --lib --lcov --output-path coverage/lcov.info

      # ── TypeScript ──────────────────────────────────────────

      - uses: actions/setup-node@v6
        if: steps.config.outputs.has_typescript == 'true'
        with:
          node-version: "24"

      - name: Install pnpm
        if: steps.config.outputs.has_typescript == 'true'
        run: corepack enable && corepack prepare pnpm@10.29.3 --activate

      - name: Restore pnpm cache
        if: steps.config.outputs.has_typescript == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-
            pnpm-

      - name: Install frontend deps
        if: steps.config.outputs.has_typescript == 'true'
        working-directory: ${{ steps.config.outputs.typescript_dir }}
        run: pnpm install --frozen-lockfile

      - name: Lint eslint
        if: steps.config.outputs.has_typescript == 'true'
        working-directory: ${{ steps.config.outputs.typescript_dir }}
        run: pnpm exec eslint .

      - name: Lint typecheck
        if: steps.config.outputs.has_typescript == 'true'
        working-directory: ${{ steps.config.outputs.typescript_dir }}
        run: pnpm exec tsc --noEmit

      - name: Test frontend
        if: steps.config.outputs.has_typescript == 'true'
        working-directory: ${{ steps.config.outputs.typescript_dir }}
        run: |
          if pnpm exec vitest --help > /dev/null 2>&1; then
            pnpm exec vitest run --coverage
          fi

      - name: Save pnpm cache
        if: steps.config.outputs.has_typescript == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}

      # ── Android ────────────────────────────────────────────

      - uses: actions/setup-java@v4
        if: steps.config.outputs.has_android == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: steps.config.outputs.has_android == 'true'

      - name: Install Gradle
        if: steps.config.outputs.has_android == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build Android
        if: steps.config.outputs.has_android == 'true'
        working-directory: ${{ steps.config.outputs.android_dir }}
        run: gradle --no-daemon ${{ steps.config.outputs.android_gradle_task }}

      # ── Python ──────────────────────────────────────────────

      - uses: actions/setup-python@v6
        if: steps.config.outputs.has_python == 'true'
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.config.outputs.has_python == 'true'
        run: pip install uv

      - name: Install backend deps
        if: steps.config.outputs.has_python == 'true'
        working-directory: ${{ steps.config.outputs.python_dir }}
        run: uv sync --extra dev

      - name: Lint backend
        if: steps.config.outputs.has_python == 'true'
        working-directory: ${{ steps.config.outputs.python_dir }}
        run: uv run --extra dev ruff check src/

      - name: Lint format backend
        if: steps.config.outputs.has_python == 'true'
        working-directory: ${{ steps.config.outputs.python_dir }}
        run: uv run --extra dev ruff format --check src/

      # ── Terraform ───────────────────────────────────────────

      - uses: hashicorp/setup-terraform@v4
        if: steps.config.outputs.has_terraform == 'true'

      - name: Lint terraform
        if: steps.config.outputs.has_terraform == 'true'
        run: terraform fmt -check -recursive infrastructure/terraform/

      # ── Vendor Compose ─────────────────────────────────────

      - name: Lint vendor config
        if: steps.config.outputs.has_vendor == 'true'
        run: |
          set -euo pipefail
          env_args=()
          if [ -f .env.example ]; then
            env_args=(--env-file .env.example)
          fi
          COMPOSE_PATHS='${{ steps.config.outputs.truenas_compose_check_paths }}'
          echo "${COMPOSE_PATHS}" | python3 -c 'import json, sys; [print(path) for path in json.load(sys.stdin)]' | while read -r compose_path; do
            docker compose "${env_args[@]}" -f "${compose_path}" config >/dev/null
          done

      # ── SonarQube ───────────────────────────────────────────

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: us-east-1

      - name: Build sonar sources list
        id: sonar
        run: |
          set -euo pipefail
          sources=""
          exclusions="**/.terraform/**"
          extra=""
          if [ "${{ steps.config.outputs.has_rust }}" = "true" ]; then
            sources="${sources:+$sources,}${{ steps.config.outputs.rust_dir }}"
            exclusions="${exclusions},**/target/**,**/target-clippy/**,**/target-cov/**,**/target-lambda/**"
          fi
          if [ "${{ steps.config.outputs.has_typescript }}" = "true" ]; then
            sources="${sources:+$sources,}${{ steps.config.outputs.typescript_dir }}/src"
            exclusions="${exclusions},**/node_modules/**,**/dist/**"
          fi
          if [ "${{ steps.config.outputs.has_python }}" = "true" ]; then
            sources="${sources:+$sources,}${{ steps.config.outputs.python_dir }}/src"
          fi
          if [ "${{ steps.config.outputs.has_terraform }}" = "true" ]; then
            sources="${sources:+$sources,}infrastructure/terraform"
          fi
          if [ -z "$sources" ]; then
            sources="."
          fi
          extra_args=""
          if [ "${{ steps.config.outputs.has_rust }}" = "true" ]; then
            extra_args="${extra_args} -Dsonar.rust.lcov.reportPaths=${{ steps.config.outputs.rust_dir }}/coverage/lcov.info"
          fi
          if [ "${{ steps.config.outputs.has_typescript }}" = "true" ]; then
            extra_args="${extra_args} -Dsonar.javascript.lcov.reportPaths=${{ steps.config.outputs.typescript_dir }}/coverage/lcov.info"
          fi
          echo "sources=${sources}" >> "$GITHUB_OUTPUT"
          echo "exclusions=${exclusions}" >> "$GITHUB_OUTPUT"
          echo "extra_args=${extra_args}" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: chris-arsenault/ahara/.github/actions/sonar-scan@main
        continue-on-error: true
        with:
          project-key: ${{ steps.config.outputs.project }}
          sources: ${{ steps.sonar.outputs.sources }}
          exclusions: ${{ steps.sonar.outputs.exclusions }}
          extra-args: ${{ steps.sonar.outputs.extra_args }}

      # ── Deploy (main only) ─────────────────────────────────

      - name: Build Rust lambdas
        if: inputs.deploy && github.ref == 'refs/heads/main' && steps.config.outputs.has_rust_lambdas == 'true'
        working-directory: ${{ steps.config.outputs.rust_dir }}
        run: |
          CARGO_TARGET_DIR=target-lambda cargo lambda build --release
          mkdir -p target
          ln -sfn "$(pwd)/target-lambda/lambda" target/lambda

      - name: Build Rust binaries
        if: inputs.deploy && github.ref == 'refs/heads/main' && steps.config.outputs.has_rust_binaries == 'true'
        run: |
          set -euo pipefail
          RUST_DIR="${{ steps.config.outputs.rust_dir }}"
          BINARIES_JSON='${{ steps.config.outputs.rust_binaries }}'
          # Build only the declared bins (selective, avoids extra workspace members)
          BIN_ARGS=$(echo "$BINARIES_JSON" | python3 -c "import sys,json; print(' '.join(f'--bin {b[\"bin\"]}' for b in json.load(sys.stdin)))")
          (cd "$RUST_DIR" && cargo build --release $BIN_ARGS)
          # Copy each built binary into <image>/dist/<bin>
          echo "$BINARIES_JSON" | python3 -c "
          import sys, json, shutil, os
          for entry in json.load(sys.stdin):
              bin_name, image = entry['bin'], entry['image']
              src = os.path.join('$RUST_DIR', 'target', 'release', bin_name)
              dst_dir = os.path.join(image, 'dist')
              os.makedirs(dst_dir, exist_ok=True)
              shutil.copy2(src, os.path.join(dst_dir, bin_name))
              print(f'copied {src} -> {dst_dir}/{bin_name}')
          "

      - name: Build frontend
        if: inputs.deploy && github.ref == 'refs/heads/main' && steps.config.outputs.has_typescript == 'true'
        working-directory: ${{ steps.config.outputs.typescript_dir }}
        run: pnpm run build

      - name: Publish to shared F-Droid repo
        if: inputs.deploy && github.ref == 'refs/heads/main' && steps.config.outputs.has_fdroid == 'true'
        working-directory: ${{ steps.config.outputs.android_dir }}
        env:
          FDROID_REPO_NAME: ${{ steps.config.outputs.fdroid_repo_name }}
          FDROID_REPO_DESCRIPTION: ${{ steps.config.outputs.fdroid_repo_description }}
          FDROID_HOSTNAME: ${{ steps.config.outputs.fdroid_hostname }}
          FDROID_APP_ID: ${{ steps.config.outputs.fdroid_app_id }}
          FDROID_APK_GLOB: ${{ steps.config.outputs.fdroid_apk_glob }}
          FDROID_METADATA_PATH: ${{ steps.config.outputs.fdroid_metadata_path }}
        run: |
          set -euo pipefail
          python3 -m pip install --user fdroidserver
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          REPO_BUCKET="$(aws ssm get-parameter --name /ahara/fdroid/repo-bucket --query Parameter.Value --output text)"
          KEY_BUCKET="$(aws ssm get-parameter --name /ahara/fdroid/signing-bucket --query Parameter.Value --output text)"
          DISTRIBUTION_ID="$(aws ssm get-parameter --name /ahara/fdroid/distribution-id --query Parameter.Value --output text)"

          # Build an UNSIGNED release APK. fdroid publish signs it with a
          # per-app key managed inside the shared repo keystore.
          gradle --no-daemon assembleRelease
          shopt -s nullglob
          apks=( $FDROID_APK_GLOB )
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK matching ${FDROID_APK_GLOB}, found ${#apks[@]}"
            exit 1
          fi
          APK="$(pwd)/${apks[0]}"
          METADATA="$(pwd)/${FDROID_METADATA_PATH}"
          if [ ! -f "$METADATA" ]; then
            echo "::error::Missing F-Droid metadata: ${FDROID_METADATA_PATH}"
            exit 1
          fi

          # fdroid working directory. The keystore (repo key + per-app keys),
          # config, and metadata are the source of truth and live in the private
          # signing bucket. The published repo/ (every app's signed APKs) lives
          # in the public repo bucket; we pull all of it so the index rebuild
          # covers the entire bucket, not just this app.
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          mkdir -p "$WORK/repo" "$WORK/unsigned" "$WORK/metadata"
          aws s3 sync "s3://${KEY_BUCKET}/workdir/" "$WORK/" --exclude 'repo/*'
          aws s3 sync "s3://${REPO_BUCKET}/repo/" "$WORK/repo/"

          cd "$WORK"

          # Bootstrap the repo keystore/config on first ever run.
          if [ ! -f keystore.p12 ]; then
            rm -f config.yml
            fdroid init --keystore keystore.p12
          fi

          # Assert repo identity every run (idempotent).
          python3 - "$FDROID_HOSTNAME" "$FDROID_REPO_NAME" "$FDROID_REPO_DESCRIPTION" <<'PY'
          import sys, yaml
          host, name, desc = sys.argv[1:4]
          with open("config.yml") as f:
              cfg = yaml.safe_load(f) or {}
          cfg["repo_url"] = f"https://{host}/repo"
          cfg["repo_name"] = name
          cfg["repo_description"] = desc
          cfg["archive_older"] = 0
          # Keep the keystore path relative to the fdroid workdir. `fdroid init`
          # bakes an absolute path from the bootstrap runner's mktemp dir, which
          # is gone on every later run; normalizing here makes it portable.
          cfg["keystore"] = "keystore.p12"
          with open("config.yml", "w") as f:
              yaml.safe_dump(cfg, f, default_flow_style=False, sort_keys=False)
          PY

          cp "$METADATA" "metadata/${FDROID_APP_ID}.yml"

          # Stage this app's unsigned APK for signing. Read versionCode from
          # Android Gradle Plugin's output metadata instead of scraping APK text.
          VERCODE="$(python3 - "$APK" <<'PY'
          import json
          import sys
          from pathlib import Path

          apk = Path(sys.argv[1])
          metadata_path = apk.parent / "output-metadata.json"
          with metadata_path.open() as f:
              metadata = json.load(f)
          elements = metadata.get("elements") or []
          matching = [e for e in elements if e.get("outputFile") == apk.name]
          selected = matching[0] if matching else elements[0]
          print(selected["versionCode"])
          PY
          )"
          APK_NAME="${FDROID_APP_ID}_${VERCODE}.apk"

          # This shared repo publishes current sideload builds, not an archive.
          # Remove prior APKs for this app before publishing the replacement.
          python3 - "$FDROID_APP_ID" <<'PY'
          import sys
          from pathlib import Path

          app_id = sys.argv[1]
          repo = Path("repo")
          for path in list(repo.glob(f"{app_id}_*.apk")) + list(repo.glob(f"{app_id}_*.apk.idsig")):
              path.unlink()
          PY

          cp "$APK" "unsigned/${APK_NAME}"

          # Sign this app (per-app key) then rebuild+sign the whole index.
          fdroid publish
          fdroid update --create-metadata

          # Persist source-of-truth state privately, publish repo/ publicly.
          aws s3 sync "$WORK/" "s3://${KEY_BUCKET}/workdir/" \
            --exclude 'repo/*' --exclude 'tmp/*' --delete
          aws s3 sync "$WORK/repo/" "s3://${REPO_BUCKET}/repo/" \
            --delete --cache-control "public,max-age=300"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/repo/*" >/dev/null
          echo "Published ${FDROID_APP_ID} to https://${FDROID_HOSTNAME}/repo"

      - name: Build Lambda (Python)
        if: inputs.deploy && github.ref == 'refs/heads/main' && steps.config.outputs.has_python == 'true'
        run: bash scripts/build-lambda.sh

      - uses: chris-arsenault/ahara/.github/actions/run-migrations@main
        if: inputs.deploy && github.ref == 'refs/heads/main' && steps.config.outputs.has_migrations == 'true'
        with:
          project: ${{ steps.config.outputs.project }}
          migrations-dir: ${{ steps.config.outputs.migrations_dir }}

      - name: Terraform deploy
        if: inputs.deploy && github.ref == 'refs/heads/main' && steps.config.outputs.has_terraform == 'true'
        env:
          STATE_BUCKET: ${{ secrets.STATE_BUCKET }}
        run: |
          terraform -chdir=infrastructure/terraform init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=us-east-1" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infrastructure/terraform apply -auto-approve

      # ── TrueNAS deploy (Docker + Komodo) ────────────────────

      - name: Set up Docker Buildx
        if: inputs.deploy && github.ref == 'refs/heads/main' && steps.config.outputs.has_truenas == 'true' && steps.config.outputs.truenas_images == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker images
        if: inputs.deploy && github.ref == 'refs/heads/main' && steps.config.outputs.has_truenas == 'true' && steps.config.outputs.truenas_images == 'true'
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          PROJECT="${{ steps.config.outputs.project }}"
          SHA="${{ github.sha }}"
          IMAGES='${{ steps.config.outputs.images }}'

          build_and_push() {
            local context="$1"
            local tag="$2"
            local latest_tag="$3"
            local cache_tag="$4"

            echo "Building ${tag} from ${context}"
            docker buildx build \
              --push \
              --tag "$tag" \
              --tag "$latest_tag" \
              --cache-from "type=registry,ref=${cache_tag}" \
              --cache-to "type=registry,ref=${cache_tag},mode=max" \
              "$context"
          }

          if [ -n "$IMAGES" ] && [ "$IMAGES" != "null" ]; then
            # Multi-image: one per component
            for COMPONENT in $(echo "$IMAGES" | python3 -c "import sys,json; [print(c) for c in json.load(sys.stdin)]"); do
              TAG="ghcr.io/chris-arsenault/${PROJECT}/${COMPONENT}:${SHA}"
              TAG_LATEST="ghcr.io/chris-arsenault/${PROJECT}/${COMPONENT}:latest"
              CACHE_TAG="ghcr.io/chris-arsenault/${PROJECT}/${COMPONENT}:buildcache"
              build_and_push "${COMPONENT}/" "$TAG" "$TAG_LATEST" "$CACHE_TAG"
            done
          else
            # Single image from root
            TAG="ghcr.io/chris-arsenault/${PROJECT}:${SHA}"
            TAG_LATEST="ghcr.io/chris-arsenault/${PROJECT}:latest"
            CACHE_TAG="ghcr.io/chris-arsenault/${PROJECT}:buildcache"
            build_and_push "." "$TAG" "$TAG_LATEST" "$CACHE_TAG"
          fi

      - name: Read TrueNAS secrets
        if: inputs.deploy && github.ref == 'refs/heads/main' && steps.config.outputs.has_truenas == 'true'
        id: truenas_secrets
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import os
          from pathlib import Path

          text = Path("secret-paths.yml").read_text()
          paths = {}
          if text.strip() and text.strip() != "{}":
              for lineno, line in enumerate(text.splitlines(), 1):
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#"):
                      continue
                  if ":" not in line:
                      raise SystemExit(f"secret-paths.yml:{lineno}: expected KEY: /ssm/path")
                  key, value = line.split(":", 1)
                  key = key.strip()
                  value = value.strip()
                  if not key or not value:
                      raise SystemExit(f"secret-paths.yml:{lineno}: expected KEY: /ssm/path")
                  paths[key] = value
          out = os.environ["GITHUB_OUTPUT"]
          lines = "\n".join(f"{k}={v}" for k, v in paths.items())
          with open(out, "a") as f:
              f.write(f"secrets<<EOF\n{lines}\nEOF\n")
          PYEOF
        shell: bash

      - uses: chris-arsenault/ahara/.github/actions/deploy-truenas@main
        if: inputs.deploy && github.ref == 'refs/heads/main' && steps.config.outputs.has_truenas == 'true'
        with:
          stack-name: ${{ steps.config.outputs.project }}
          repo: ${{ github.repository }}
          compose-path: ${{ steps.config.outputs.truenas_compose_path }}
          image-tag: ${{ steps.config.outputs.truenas_images == 'true' && github.sha || '' }}
          secrets: ${{ steps.truenas_secrets.outputs.secrets }}
          roles-anywhere: ${{ steps.config.outputs.truenas_roles_anywhere }}

      # ── Grafana dashboard deploy ───────────────────────────

      - uses: chris-arsenault/ahara/.github/actions/deploy-grafana-dashboards@main
        if: inputs.deploy && github.ref == 'refs/heads/main' && steps.config.outputs.has_grafana_dashboards == 'true'
        with:
          project: ${{ steps.config.outputs.project }}
          dashboards-path: ${{ steps.config.outputs.dashboard_path }}
          folder-uid: ${{ steps.config.outputs.dashboard_folder_uid }}
          folder-title: ${{ steps.config.outputs.dashboard_folder_title }}
          prune: ${{ steps.config.outputs.dashboard_prune }}

      # ── Save caches (after all build/deploy steps) ─────────

      - name: Save Rust caches
        if: steps.config.outputs.has_rust == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            **/target
            **/target-clippy
            **/target-cov
            **/target-lambda
          key: rust-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}

  report:
    if: always()
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: us-east-1
      - uses: chris-arsenault/ahara/.github/actions/report-build@main
